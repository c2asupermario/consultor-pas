<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultor PAS - Beneficios Adicionales (Dinámico · Guía 60)</title>
<style>
:root{--primary:#1a5276;--secondary:#3498db;--success:#27ae60;--danger:#e74c3c;--bg:#f4f7f6;--white:#fff;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);margin:0;padding:10px;color:#333;}
.container{max-width:1200px;margin:auto;background:var(--white);padding:15px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.05);}
h1{font-size:1.1rem;color:var(--primary);text-align:center;margin:4px 0 2px;}
.sub{text-align:center;font-size:.72rem;color:#94a3b8;margin-bottom:12px;}
.top-panel{background:#f8f9fa;padding:15px;border-radius:15px;margin-bottom:15px;border:1px solid #edf2f7;max-width:600px;margin-left:auto;margin-right:auto;}
.search-box{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;}
.input-group{display:flex;flex-direction:column;gap:4px;}
.input-group label{font-size:.7rem;font-weight:bold;color:#64748b;text-transform:uppercase;}
input,select{padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:1rem;text-align:center;outline:none;background:#fff;}
input:focus,select:focus{border-color:var(--secondary);}
.antig-box{padding:12px 14px;border-radius:10px;background:var(--primary);color:#fff;font-size:1.1rem;font-weight:900;text-align:center;white-space:nowrap;}
.grid-view{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:12px;}
.card{border:2px solid #f0f4f8;border-radius:16px;padding:12px;background:#fff;position:relative;}
.card.premium{border-color:var(--success);}
.card.tr{border-color:var(--secondary);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.header-left{display:flex;align-items:center;gap:10px;}
.id-badge{background:var(--primary);color:#fff;padding:4px 10px;border-radius:8px;font-weight:bold;font-size:1.1rem;min-width:35px;text-align:center;}
.plan-name{font-weight:bold;color:var(--primary);font-size:1.05rem;}
.max-year{font-size:.75rem;color:#7f8c8d;font-weight:bold;}
.tag-cob{font-size:.7rem;padding:3px 8px;border-radius:6px;background:#ebf2f7;color:var(--primary);border:1px solid #d6e4ef;font-weight:bold;margin-right:4px;margin-bottom:4px;display:inline-block;}
.item-list{list-style:none;padding:0;margin:8px 0;font-size:.9rem;}
.item-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;padding:2px 0;border-bottom:1px dashed #f1f5f9;}
.ben-name{white-space:nowrap;}
.evento-text{font-size:.78rem;color:#94a3b8;font-style:italic;flex-grow:1;margin-left:8px;text-align:right;}
.val{font-weight:bold;color:var(--danger);margin-left:8px;}
.sl{color:var(--success);font-weight:bold;margin-left:8px;}
.inc{color:var(--success);font-weight:bold;margin-left:8px;}
.sin-ben{font-size:.8rem;color:#94a3b8;font-style:italic;padding:6px 0;}
.aviso-suma{grid-column:1/-1;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:12px 16px;border-radius:12px;font-size:.85rem;text-align:center;margin-bottom:8px;}
.franquicia-box{background:#fff3f3;border:1px solid #fecaca;color:#dc2626;padding:8px;border-radius:10px;margin-bottom:10px;font-weight:bold;font-size:.9rem;text-align:center;}
.franquicia-box.sinf{background:#ecfdf5;border-color:#a7f3d0;color:#047857;}
.franquicia-box.pend{background:#fff7ed;border-color:#fdba74;color:#9a3412;}
.footer-row{display:flex;gap:8px;margin-top:10px;}
.grua-tag{flex:1;font-size:.82rem;color:var(--primary);font-weight:bold;display:flex;justify-content:space-between;align-items:center;background:#e1f5fe;padding:10px;border-radius:10px;gap:6px;}
.btn-ws{background:#25d366;color:#fff;border:none;border-radius:10px;padding:0 15px;cursor:pointer;font-size:1.2rem;}
.cat-header{grid-column:1/-1;color:#fff;padding:10px 18px;border-radius:12px;font-size:.85rem;font-weight:900;margin-top:25px;text-transform:uppercase;letter-spacing:1.5px;}
.cat-header:first-child{margin-top:0;}
.cat-tra{background:linear-gradient(90deg,#c0392b,#e74c3c);border-left:6px solid #922b21;}
.cat-c{background:linear-gradient(90deg,#138d75,#1abc9c);border-left:6px solid #0e6655;}
.cat-b{background:linear-gradient(90deg,#d68910,#f39c12);border-left:6px solid #9c640c;}
.cat-a{background:linear-gradient(90deg,#2e4053,#5d6d7e);border-left:6px solid #1c2833;}
.tipo-row{display:flex;gap:10px;align-items:end;margin-bottom:10px;}
.tipo-row .input-group{flex:0 0 55%;}
.btn-toggle{flex:1;background:var(--primary);color:#fff;border:none;padding:0 16px;height:45px;border-radius:10px;cursor:pointer;font-size:.95rem;font-weight:bold;white-space:nowrap;}
.btn-toggle:hover{background:#154360;}
.tabla-wrap{overflow-x:auto;}
table.cuadro{border-collapse:collapse;width:100%;font-size:.74rem;}
table.cuadro th,table.cuadro td{border:1px solid #a8b4c0;padding:5px 6px;text-align:center;white-space:nowrap;}
table.cuadro thead th{background:#ebf2f7;color:var(--primary);position:sticky;top:0;border-bottom:2px solid var(--primary);}
table.cuadro th.ben-col,table.cuadro td.ben-col{text-align:left;position:sticky;left:0;background:#fff;font-weight:bold;min-width:190px;white-space:normal;z-index:2;}
table.cuadro thead th.ben-col{z-index:3;}
table.cuadro small{color:#333;font-style:italic;}
table.cuadro .sl{color:var(--success);font-weight:bold;}
table.cuadro .val{color:var(--danger);font-weight:bold;}
table.cuadro .no{color:#cbd5e1;}
table.cuadro th.cat-tra{background:#fdecea;color:#922b21;}
table.cuadro th.cat-c{background:#e8f8f5;color:#0e6655;}
table.cuadro th.cat-b{background:#fef5e7;color:#9c640c;}
table.cuadro th.cat-a{background:#eaeded;color:#1c2833;}
table.cuadro tr.fila-franquicia td{background:#fff3f3;}
table.cuadro tr.fila-franquicia td.ben-col{background:#fff3f3;color:#dc2626;}
table.cuadro tr.fila-franquicia small{color:#c0392b;}
table.cuadro tr.fila-resumen td{background:#ebf2f7;color:var(--primary);font-size:.68rem;font-weight:bold;white-space:normal;line-height:1.4;}
table.cuadro tr.fila-resumen td.ben-col{background:#ebf2f7;color:var(--primary);}
table.cuadro tbody tr:nth-child(even):not(.fila-franquicia) td{background:#e8ecef;}
table.cuadro tbody tr:nth-child(even):not(.fila-franquicia) td.ben-col{background:#dde3e8;}
details.grupo-cuadro{margin-bottom:2px;}
details.grupo-cuadro summary.cat-header{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;margin-top:25px;}
details.grupo-cuadro:first-of-type summary.cat-header{margin-top:0;}
details.grupo-cuadro summary.cat-header::-webkit-details-marker{display:none;}
details.grupo-cuadro summary.cat-header::after{content:'▾';font-size:1rem;margin-left:8px;}
details.grupo-cuadro:not([open]) summary.cat-header::after{content:'▸';}
</style>
</head>

];

const GRUPOS_CON_FCIA_POR_TIPO = {
  AUTOS: ['D','J','J1','J2','J3','M','O','P'],
  MOTOS: []
};
let tipoActual = 'AUTOS';

function cambiarTipo(){
  tipoActual = document.getElementById('selTipo').value;
  document.getElementById('tituloApp').textContent = TITULO_POR_TIPO[tipoActual];
  document.getElementById('grupoSuma').style.display = tipoActual==='MOTOS' ? 'none' : '';
  actualizarTodo();
}

function fmtMoneda(input){let v=input.value.replace(/\D/g,'');input.value=v?parseInt(v).toLocaleString('es-AR'):'';}
function pesos(n){return '$'+Number(n).toLocaleString('es-AR');}

function fmt(v){
  if(v===-1) return {t:'SIN LÍMITE', c:'sl'};
  if(typeof v==='number' && v>0) return {t:pesos(v), c:'val'};
  return null;
}

function buscarFranquicia(cob, suma){
  if(suma<=0) return null;
  const f=FRA.find(x=>x.cob===cob && suma>=x.desde && suma<=x.hasta);
  return f?f.monto:null;
}

function lineasBeneficios(c){
  let html='';
  for(const b of BEN){
    if(b.bool){
      if(String(c[b.k]).toUpperCase()==='SI')
        html+='<li class="item-row"><span class="ben-name">✅ '+b.l+'</span><span class="inc">INCLUIDO</span></li>';
      continue;
    }
    const f=fmt(c[b.k]);
    if(!f) continue;
    const ev = b.ev && c[b.ev] ? '<span class="evento-text">'+c[b.ev]+'</span>' : '';
    html+='<li class="item-row"><span class="ben-name">✅ '+b.l+'</span>'+ev+'<span class="'+f.c+'">'+f.t+'</span></li>';
  }
  if(typeof c.AP_Suma==='number' && c.AP_Suma>0){
    const det = (typeof c.AP_Suma_max==='number'&&c.AP_Suma_max>0)?' · máx '+pesos(c.AP_Suma_max):'';
    html+='<li class="item-row"><span class="ben-name">✅ Accidentes Personales</span><span class="evento-text">x persona'+det+'</span><span class="val">'+pesos(c.AP_Suma)+'</span></li>';
  }
  if(!html) html='<div class="sin-ben">Cobertura básica · sin beneficios adicionales</div>';
  return html;
}

function gruaTxt(c){
  const km = c.Grua_km===-1 ? 'Sin límite' : c.Grua_km+' km';
  return km+' · '+c.Grua_mes+'/mes · '+c.Grua_anual+'/año';
}

function msgWhatsApp(c, antig, suma, fraTxt){
  let m='*Cooperación Seguros - '+c.NomFantasia+'* ('+c.GrupoCob+')\n';
  m+='🚗 Unidad antig. '+antig+' años (máx '+c.Max_Antig+')\n';
  if(suma>0) m+='💰 Suma: '+pesos(suma)+'\n';
  if(fraTxt) m+='🔴 '+fraTxt+'\n';
  m+='--------------------------\n';
  for(const b of BEN){
    if(b.bool){ if(String(c[b.k]).toUpperCase()==='SI') m+='✅ '+b.l+'\n'; continue; }
    const f=fmt(c[b.k]); if(!f) continue;
    const ev=b.ev&&c[b.ev]?' ('+c[b.ev]+')':'';
    m+='✅ '+b.l+': '+f.t.replace('SIN LÍMITE','Sin Límite')+ev+'\n';
  }
  if(typeof c.AP_Suma==='number'&&c.AP_Suma>0) m+='✅ Accidentes Personales: '+pesos(c.AP_Suma)+' x persona\n';
  m+='🚚 Grúa: '+gruaTxt(c)+'\n--------------------------\n_Sujeto a pautas de suscripción._';
  return m;
}

function copiar(idx){
  const c=window.__rows[idx];
  navigator.clipboard.writeText(c.__msg).then(()=>alert('¡Copiado para WhatsApp!'));
}

function procesar(){
  const anio=parseInt(document.getElementById('txtAnio').value)||ANIO_HOY;
  const suma=parseInt(document.getElementById('txtSuma').value.replace(/\./g,''))||0;
  const antig=ANIO_HOY-anio;
  document.getElementById('antigBox').textContent = antig+' '+(antig===1?'año':'años');
  const esAutos = tipoActual==='AUTOS';
  const soloA = esAutos && suma<=0; // sin suma asegurada solo se cotiza la RC básica (A) — solo aplica a AUTOS
  const datosTipo = DATA.filter(d=>d.TIPO===tipoActual);
  const CATS = CATS_POR_TIPO[tipoActual];
  const GRUPOS_CON_FCIA = GRUPOS_CON_FCIA_POR_TIPO[tipoActual];
  const grid=document.getElementById('grid');
  window.__rows=[]; let idx=0;
  let h='';

  if(soloA) h+='<div class="aviso-suma">Ingresá la <b>suma asegurada</b> para cotizar las demás coberturas. Sin suma solo se ofrece la <b>RC Básica (A)</b>.</div>';

  for(const cat of CATS){
    const cobs = cat.grupos
      .map(g=>datosTipo.find(d=>d.GrupoCob===g))
      .filter(c=>c && antig<=c.Max_Antig && (!soloA || c.GrupoCob==='A'));
    if(!cobs.length) continue;
    h+='<details class="grupo-cuadro"'+(cat.colapsado?'':' open')+'><summary class="cat-header '+cat.cls+'">'+cat.nombre+'</summary><div class="grid-view">';
    for(const c of cobs){
      let fraTxt='', fraBox='';
      if(!esAutos){
        if(c.Franq_Pct>0){
          fraTxt='Franquicia: '+c.Franq_Pct+'%';
          fraBox='<div class="franquicia-box">🔴 '+fraTxt+'</div>';
        }
      } else if(GRUPOS_CON_FCIA.includes(c.GrupoCob)){
        const monto=buscarFranquicia(c.GrupoCob, suma);
        if(monto!==null){
          fraTxt='Franquicia: '+pesos(monto);
          fraBox='<div class="franquicia-box">🔴 '+fraTxt+'</div>';
        } else {
          fraBox='<div class="franquicia-box pend">Ingresá la suma asegurada para ver la franquicia</div>';
        }
      } else if(c.GrupoCob==='F'){
        fraTxt='Todo Riesgo SIN Franquicia';
        fraBox='<div class="franquicia-box sinf">✔ '+fraTxt+'</div>';
      }
      const tags=String(c['Resumen Cobertura']).split(',').map(t=>'<span class="tag-cob">'+t.trim()+'</span>').join('');
      const premium=['F','D','P','C2'].includes(c.GrupoCob)?'premium':'';
      const tr=GRUPOS_CON_FCIA.includes(c.GrupoCob)?'tr':'';
      c.__msg=msgWhatsApp(c,antig,suma,fraTxt);
      window.__rows[idx]=c;
      h+=
        '<div class="card '+premium+' '+tr+'">'+
          '<div class="card-header">'+
            '<div class="header-left"><span class="id-badge">'+c.GrupoCob+'</span><span class="plan-name">'+c.NomFantasia+'</span></div>'+
            '<span class="max-year">Antig. Máx: '+c.Max_Antig+' años</span>'+
          '</div>'+
          fraBox+
          '<div>'+tags+'</div>'+
          '<ul class="item-list">'+lineasBeneficios(c)+'</ul>'+
          '<div class="footer-row">'+
            '<div class="grua-tag"><span>🚚 Grúa</span><span>'+gruaTxt(c)+'</span></div>'+
            '<button class="btn-ws" onclick="copiar('+idx+')" title="Copiar para WhatsApp">📲</button>'+
          '</div>'+
        '</div>';
      idx++;
    }
    h+='</div></details>';
  }
  grid.innerHTML = h || '<div class="sub">No hay coberturas disponibles para esa antigüedad.</div>';
}
procesar();

let vistaActual='tarjetas';
function toggleVista(){
  vistaActual = vistaActual==='tarjetas' ? 'cuadro' : 'tarjetas';
  document.getElementById('grid').style.display = vistaActual==='tarjetas' ? '' : 'none';
  document.getElementById('cuadro').style.display = vistaActual==='cuadro' ? '' : 'none';
  document.getElementById('btnToggle').textContent = vistaActual==='tarjetas' ? '📊 Cuadro' : '🎴 Tarjetas';
  if(vistaActual==='cuadro') renderCuadro();
}

function actualizarTodo(){
  procesar();
  if(vistaActual==='cuadro') renderCuadro();
}

function boolTxt(v){
  const s=String(v).toUpperCase();
  if(s==='SI') return '<span class="sl">SI</span>';
  if(s==='NO') return '<span class="no">NO</span>';
  return '<span class="no">—</span>';
}
function montoEv(v, ev){
  if(v===-1) return '<span class="sl">SIN LÍMITE</span>'+(ev?'<br><small>'+ev+'</small>':'');
  if(typeof v==='number' && v>0) return '<span class="val">'+pesos(v)+'</span>'+(ev?'<br><small>'+ev+'</small>':'');
  return '<span class="no">—</span>';
}
function gruaCuadroTxt(c){
  const km = c.Grua_km===-1 ? 'Sin límite' : c.Grua_km+' km';
  const cls = c.Grua_km===-1 ? 'sl' : 'val';
  return '<span class="'+cls+'">'+km+'</span><br><small>'+c.Grua_mes+'/mes · '+c.Grua_anual+'/año</small>';
}

const FILAS_CUADRO = [
  {l:'Reposición a Nuevo (Unidad)',        has:c=>['SI','NO'].includes(String(c.repo_nvo).toUpperCase()),                get:c=>boolTxt(c.repo_nvo)},
  {l:'Reposición a Nuevo (Ruedas)',        has:c=>['SI','NO'].includes(String(c.repo_rueda).toUpperCase()),             get:c=>boolTxt(c.repo_rueda)},
  {l:'Rotura Cristales Laterales',         has:c=>c.Crista_late_Suma===-1||c.Crista_late_Suma>0,                       get:c=>montoEv(c.Crista_late_Suma, c.Crista_late_Eventos)},
  {l:'Rotura Cerraduras (robo/intento)',   has:c=>c.Cerraduras_Suma===-1||c.Cerraduras_Suma>0,                         get:c=>montoEv(c.Cerraduras_Suma, c.Cerraduras_eventos)},
  {l:'Daños por Granizo',                  has:c=>c.Granizo_Suma===-1||c.Granizo_Suma>0,                               get:c=>montoEv(c.Granizo_Suma, c.Granizo_Eventos)},
  {l:'Parabrisas / Lunetas',               has:c=>c.Parabrisas_Suma===-1||c.Parabrisas_Suma>0,                         get:c=>montoEv(c.Parabrisas_Suma, c.Parabrisas_Eventos)},
  {l:'Gastos de Gestoría (RPNA)',          has:c=>c.Gestoria_Suma>0,                                                   get:c=>montoEv(c.Gestoria_Suma)},
  {l:'Accidentes Personales (x persona)',  has:c=>c.AP_Suma>0,                                                         get:c=> c.AP_Suma>0 ? '<span class="val">'+pesos(c.AP_Suma)+'</span>'+(c.AP_Suma_max?'<br><small>máx '+pesos(c.AP_Suma_max)+'</small>':'') : '<span class="no">—</span>'},
  {l:'Daño Parcial x Robo Total',          has:c=>c.Daño_parcial_x_Robo>0,                                             get:c=>montoEv(c.Daño_parcial_x_Robo)},
  {l:'Sin Franq. fija si daño supera',     has:c=>c.NO_Franquicia>0,                                                   get:c=> c.NO_Franquicia>0 ? '<span class="val">'+pesos(c.NO_Franquicia)+'</span>' : '<span class="no">—</span>'},
  {l:'Grúa',                                has:()=>true,                                                               get:c=>gruaCuadroTxt(c)},
  {l:'Antigüedad máxima',                  has:()=>true,                                                               get:c=>c.Max_Antig+' años'}
];

function franquiciaTxt(c){
  if(c.TIPO==='MOTOS'){
    if(c.Franq_Pct>0) return '<span class="val">'+c.Franq_Pct+'%</span>';
    return '<span class="no">—</span>';
  }
  if(c.GrupoCob==='F') return '<span class="sl">SIN FRANQUICIA</span>';
  const tramos = FRA.filter(f=>f.cob===c.GrupoCob);
  if(!tramos.length) return '<span class="no">—</span>';
  const montos = tramos.map(t=>t.monto);
  const min = Math.min(...montos), max = Math.max(...montos);
  if(min===max) return '<span class="val">'+pesos(min)+'</span><br><small>fija</small>';
  return '<span class="val">'+pesos(min)+' – '+pesos(max)+'</span><br><small>según suma asegurada</small>';
}

const GRUPOS_CUADRO_POR_TIPO = {
  AUTOS: [
    {nombre:'TODO RIESGO · SIN FRANQUICIA', cls:'cat-tra', grupos:['F'], franquicia:true, colapsado:true},
    {nombre:'TODO RIESGO · CON FRANQUICIA', cls:'cat-tra', grupos:['P','O','M','D','J','J1','J2','J3'], franquicia:true},
    {nombre:'TERCEROS COMPLETO', cls:'cat-c', grupos:['C2','C','C1']},
    {nombre:'SOLO TOTALES', cls:'cat-b', grupos:['B2','B','B1']},
    {nombre:'BÁSICA', cls:'cat-a', grupos:['A1','A']}
  ],
  MOTOS: [
    {nombre:'COBERTURAS', cls:'cat-b', grupos:['A','B','B1','B4','J'], franquicia:true}
  ]
};

function renderCuadro(){
  const anio=parseInt(document.getElementById('txtAnio').value)||ANIO_HOY;
  const antig=ANIO_HOY-anio;
  const datosTipo = DATA.filter(d=>d.TIPO===tipoActual);
  const GRUPOS_CUADRO = GRUPOS_CUADRO_POR_TIPO[tipoActual];
  let h='';
  for(const grupo of GRUPOS_CUADRO){
    const cobs = grupo.grupos.map(g=>datosTipo.find(d=>d.GrupoCob===g)).filter(c=>c && antig<=c.Max_Antig);
    if(!cobs.length) continue;
    const filas = FILAS_CUADRO.filter(fila=>cobs.some(c=>fila.has(c)));
    h+='<details class="grupo-cuadro"'+(grupo.colapsado?'':' open')+'><summary class="cat-header '+grupo.cls+'">'+grupo.nombre+'</summary>';
    h+='<div class="tabla-wrap"><table class="cuadro"><thead><tr><th class="ben-col">Beneficio</th>';
    for(const c of cobs) h+='<th class="'+grupo.cls+'">'+c.GrupoCob+'</th>';
    h+='</tr></thead><tbody>';
    h+='<tr class="fila-resumen"><td class="ben-col">Cobertura</td>';
    for(const c of cobs) h+='<td>'+String(c['Resumen Cobertura']).split(',').map(t=>t.trim()).join('<br>')+'</td>';
    h+='</tr>';
    if(grupo.franquicia){
      h+='<tr class="fila-franquicia"><td class="ben-col">Franquicia <small>(no es beneficio adicional)</small></td>';
      for(const c of cobs) h+='<td>'+franquiciaTxt(c)+'</td>';
      h+='</tr>';
    }
    for(const fila of filas){
      h+='<tr><td class="ben-col">'+fila.l+'</td>';
      for(const c of cobs) h+='<td>'+fila.get(c)+'</td>';
      h+='</tr>';
    }
    h+='</tbody></table></div></details>';
  }
  h+='<div class="sub" style="margin-top:10px;">Cuadro filtrado por antigüedad según el Año Modelo ingresado arriba (columnas sin cobertura para esa antigüedad no se muestran). Las filas de franquicia muestran el rango entre tramos; el monto exacto depende de la suma asegurada del auto.</div>';
  document.getElementById('cuadro').innerHTML=h;
}
